<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon: a forged seam.

    Letterforms lose at 16px — "DRS" is unreadable and a thin "D" in the brand
    weight disappears entirely. So this is the mark the site already uses: dark
    steel split by a molten seam with a white-hot core, the same idea as the
    preloader and the opening plate. It stays legible as a shape at any size.
  -->
  <rect width="64" height="64" rx="13" fill="#08090d"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.5" fill="none" stroke="#1e2027" stroke-width="1.5"/>
  <defs>
    <linearGradient id="seam" x1="10" y1="42" x2="54" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c1a00"/>
      <stop offset="0.42" stop-color="#c23c02"/>
      <stop offset="0.78" stop-color="#ff8c25"/>
      <stop offset="1" stop-color="#ffe6c2"/>
    </linearGradient>
  </defs>
  <path d="M9 41 L24 35 L31 38 L44 27 L55 22" fill="none" stroke="url(#seam)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="22" r="3.4" fill="#fff4dc"/>
</svg>
